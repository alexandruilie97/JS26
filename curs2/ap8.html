<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let ms = new Date();
        let time = ms.getMilliseconds();
        if(time <100){
            alert('Milisecunda 0- 100')
        }
        else if(time >= 100 && time < 200 ){
            alert('Milisecunda 100-200')
        }
         else if(time >= 200 && time < 300 ){
            alert('Milisecunda 200-300')
        }
         else if(time >= 300 && time < 400 ){
            alert('Milisecunda 300-400')
        }
         else if(time >= 400 && time < 500 ){
            alert('Milisecunda 400-500')
        }
         else if(time >= 500 && time < 600 ){
            alert('Milisecunda 500-600')
        }
         else if(time >= 600 && time < 700 ){
            alert('Milisecunda 600-700')
        }
         else if(time >= 700 && time < 800 ){
            alert('Milisecunda 700-800')
        }
         else if(time >= 800 && time < 900 ){
            alert('Milisecunda 800-900')
        }
        else{
            alert('Milisecunda 900-999')
        }
    </script>
</body>
</html>
