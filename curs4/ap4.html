<body>
    <p>Sortare Array [5, 9, 1, 3, 7, 4, 3, 8 , 11, 14 , 2, 4]</p>
    <script>
        let myArr = [5, 9, 1, 3, 7, 4, 3, 8 , 11, 14 , 2, 4];
        let lungime = myArr.length;
        document.write(myArr);


        for (let i = 0; i < lungime; i++){
            for( let j = 0; j < lungime; j++){
                if(myArr[j] <= myArr[j + 1]){
                    let aux =myArr[j];
                    myArr[j] =myArr[j+1];
                    myArr[j+1] = aux;

                }
            }
        }
        console.log(myArr);

        //metoda 2
        console.log(myArr.sort());
        //urmeaza functii 2:28
        
        

    </script>
</body>
