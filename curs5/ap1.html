<html lang="en">
<head>

<body>
    <script>
        let myArr = [5, 6, 8, 1, 2, 3,4,9 ];
        console.log(myArr);
        let suma = myArr.reduce(function(s, a){
            return s + a;
        });
        let newArray =myArr.sort().reverse();
        console.log(newArray);
        console.log(suma);

        let suma2 = 0;
        myArr.forEach(function(a){suma2 +=a;});
        console.log(suma2);
    </script>
</body>
